# 데이터 경로, 특징 조건, 모형 후보와 평가 규칙을 한곳에서 관리하는 설정 파일이다.
# 파이프라인과 각 처리 모듈에 전달할 공통 설정값을 정의한다.
# COLUMN_MAPPING의 null은 원본 열 이름 미설정 값이다.
PROJECT: KOSPI 차월 수익률 예측 연구 / 팀05
PYTHON_TARGET: '3.12.10'
PATHS:
  wide_csv:
    warmup_2000:
      adjusted_monthly_return: data/raw/warmup_2000__adjusted_monthly_return.csv
      raw_month_end_market_cap: data/raw/warmup_2000__raw_month_end_market_cap.csv
      raw_month_end_price: data/raw/warmup_2000__raw_month_end_price.csv
      raw_month_end_shares_outstanding: data/raw/warmup_2000__raw_month_end_shares_outstanding.csv
      company_name: data/raw/warmup_2000__company_name.csv
      isin: data/raw/warmup_2000__isin.csv
    train_2001_2021:
      adjusted_monthly_return: data/raw/train_2001_2021__adjusted_monthly_return.csv
      raw_month_end_market_cap: data/raw/train_2001_2021__raw_month_end_market_cap.csv
      raw_month_end_price: data/raw/train_2001_2021__raw_month_end_price.csv
      raw_month_end_shares_outstanding: data/raw/train_2001_2021__raw_month_end_shares_outstanding.csv
      company_name: data/raw/train_2001_2021__company_name.csv
      isin: data/raw/train_2001_2021__isin.csv
  security_map_csv: data/raw/security_map.csv
  dart_csv: data/raw/dart.csv
  documents_csv: data/raw/documents.csv
  panel: data/interim/panel.parquet
  asof: data/interim/asof.parquet
  eligibility: data/interim/eligibility.parquet
  trading_days: data/interim/trading_days.parquet
  h1_components: data/processed/h1_components.parquet
  mom: data/processed/mom.parquet
  h1: data/processed/h1.parquet
  h3: data/processed/h3.parquet
  features: data/processed/features.parquet
  samples: data/processed/samples.parquet
  predictions: outputs/validation/predictions.csv
  monthly_ic: outputs/validation/monthly_ic.csv
  final_test: outputs/final_test/
  models: models/
  run_records: outputs/run_id/
COLUMN_MAPPING:
  panel:
    stock_id: stock_id
    month: month
    return: adjusted_monthly_return
    market_cap: raw_month_end_market_cap
    price: raw_month_end_price
    shares_outstanding: raw_month_end_shares_outstanding
    company_name: company_name
    isin: isin
    # 역사적 적격성 원천은 미확보. True/False를 추정하지 않는다.
    eligible: null
  security_map:
    stock_id: null
    corp_code: null
    valid_from: null
    valid_to: null
    evidence: null
  dart:
    corp_code: null
    fiscal_period: null
    published_at: null
    receipt_id: null
    equity: null
    statement_type: null
    account: null
    unit: null
    revision: null
  documents:
    document_id: null
    source: null
    published_at: null
    raw_path: null
    collection_status: null
    meeting_date: null
    release_date_source: null
UNITS:
  return: decimal
  market_cap: KRW
  price: KRW
  shares_outstanding: shares
  equity: KRW
KEY_FORMATS:
  stock_id: 6-character string (letters allowed, leading zeros preserved)
  corp_code: 8-digit string
  month: YYYY-MM
ELIGIBILITY_SOURCE: krx_kospi_listing_delisting_lists_plus_marcap_month_end  # data/raw/상장, data/raw/상장폐지, data/raw/marcap (src/preprocessing/listing.py)
TIMEZONE: Asia/Seoul
PIT:
  cutoff: base_month calendar end
  unknown_publication_date: exclude
  unknown_time_on_month_end: next_base_month
  correction: never retroactive
  market_month_end: last trading day finalized market values
TARGET_MONTH_OFFSET: 1
H1:
  momentum_months: 11
  momentum_start_offset: -11
  momentum_end_offset: -1
  size_transform: natural_log
  ddof: 1
  min_stocks: 2
  coefficients:
    size: -1
    bm: 1
    mom: 1
  divisor: 3
  universe: same-month common valid Size/BM/Mom, independent of target y
H3:
  lambda: 0.97
  init_n_valid: 10
  init_ddof: 1
  recent_window: 12
  recent_min_valid: 10
  ddof: 1
  includes_base_month: true
  missing_month: preserve state
  reinitialize_every_12_months: false
  raw_feature: sqrt(v)
# 확장 사용 여부와 함수에 전달할 명세. null인 명세는 확정 후 설정한다.
H2:
  enabled: false
  lexicon: null
  context_rules: null
  publication_date_rule:
    preferred: actual_release_date
    fallback: meeting_date_proxy
    fallback_flag_required: true
    unknown_time_on_month_end: next_base_month
  sensitivity_spec:
    source: panel_market_cap
    transform: natural_log
    standardize: monthly_zscore
    ddof: 1
    direction: smaller_is_higher
H4:
  enabled: false
  search_spec: null
  uncertainty_lexicon: null
  matching_spec: null
  aggregation_spec: null
PERIODS:
  warmup:
  - 2000
  - 2000
  train:
  - 2001
  - 2021
  test:
  - 2022
  - 2025
FOLDS:
  split_key: target_month
  train_start_year: 2001
  initial_train_end_year: 2005
  first_validation_year: 2006
  last_validation_year: 2021
  min_external_train_years: 5
OLS:
  fit_intercept: true
# 2026-11-10 사용자 결정: 후보는 glmnet 방식 λ(평균 오차 기준 벌점)로 정의하고 sklearn alpha = λ × 학습 행 수로 바꾼다.
# 확장 창에서 학습 행이 3만→15만으로 늘어도 같은 λ면 같은 세기의 벌점이 되도록 하기 위함(이전 alphas 0.01~100은 사실상 OLS).
# λ는 Fold마다 학습 기간 마지막 1년을 내부 검증으로 떼어 평균 Rank IC로 고른다. 바깥 검증 연도는 선택에 쓰지 않는다.
RIDGE:
  fit_intercept: true
  lambdas:
  - 0.001
  - 0.01
  - 0.1
  - 1
  - 10
  alpha_scaling: lambda_times_train_rows
  # 2026-11-10: 입력은 Fold 학습 행의 평균·표준편차(ddof=0)로 표준화한 뒤 벌점(glmnet standardize=TRUE, ESL 3.4.1). 계수는 원래 크기로도 보고.
  standardize: train_rows_mean_sd_ddof0
  inner_validation_years: 1
  selection_metric: mean_rank_ic
  tie_rule: larger_lambda
MLP:
  hidden_layer_sizes:
  - - 32
  - - 64
    - 32
  activation: relu
  solver: adam
  learning_rate_init: 0.001
  batch_size: 256
  max_iter: 500
  alphas:
  - 0.0001
  - 0.01
  random_state: 42
  shuffle: false
  early_stopping: false
  tie_rule: fewer_total_hidden_nodes_then_larger_alpha
# 2026-11-11 사용자 결정(시험 단계): 부스팅 2×2 = {XGBoost, LightGBM} × {회귀, 순위}. MLP 항목은 그대로 둔다.
# 회귀는 제곱오차, 순위는 lambdarank. 순위 정답은 학습 기간 안에서 매달 수익률 5분위(0~4), 그룹은 목표월.
# 평가는 다른 모형과 같은 월별 Rank IC. 하이퍼파라미터 후보와 잘림·이득 설정 통일 여부는 미정.
# 설치 버전 기본값(확인 2026-11-11): XGBoost rank:ndcg = pair_method topk, num_pair_per_sample 최대(사실상 전체 쌍),
#   ndcg_exp_gain true(2^등급-1). LightGBM lambdarank = truncation_level 30(상위 30위 쌍만), label_gain 2^등급-1.
BOOSTING:
  libraries: [xgboost, lightgbm]
  label_grouping: target_month
  rank_label: monthly_quintile_0_4
  regression_objective:
    xgboost: reg:squarederror
    lightgbm: regression
  rank_objective:
    xgboost: rank:ndcg
    lightgbm: lambdarank
  hyperparameters: null
  inner_validation_years: 1
  selection_metric: mean_rank_ic
EVALUATION:
  method: monthly_spearman
  tie_method: average
  min_valid_stocks: 3
  constant_rank: missing_with_reason
  aggregation: equal_weight_common_valid_months
  candidate_failure: record_and_exclude
  tie_tolerance: null
SAMPLE_ID: null
REPRODUCIBILITY_PREDICTION_ATOL: 1.0e-10
FINAL_TEST_ENABLED: false
TEST_ACCESS_REQUIRES_FROZEN_CONFIG: true

# 2026-11-05 사용자 승인: 2단계, 대표 연도 2021. 이후 단계는 별도 승인.
H1_TEST:
  approved_stage: 2
  representative_year: 2021
  notion_tables_path: outputs/h1_report.md
  pca_winsorization: null
  pca_components: [PC1]
  pca_combination: null
  pca_sign_rule: first_largest_abs_positive_then_previous_same_rank
  selected_candidate: null
  hac_approved: true

# 2026-11-06: 원값·제한값 PC1 순위 상관 비교 승인. 후보 선정·검정은 별도.
H1_PCA:
  approved_scope: structure_diagnostics
  variants: [raw, winsor]
  run_category: h1_pca반영지수

  # PC1 점수에도 기존 표시 방향을 유지하는 규칙을 사용자 승인.
  display_sign_rule: first_largest_abs_positive_then_previous_same_rank
  pc1_ic_approved: true
  pc1_ic_variants: [raw, winsor]
  comparison_figures: false
  constrained_exploration_approved: true
  constrained_variants: [raw, winsor]
  development_closed: true

H1_HYPOTHESIS:
  approved: true
  run_category: h1가설검정
  alpha: 0.05
  reference_distribution: t
  df: T-1
  lag_rule: floor(4*(T/100)^(2/9))
  kernel: Bartlett
  small_sample_correction: false
  holm_family: nine_paired_differences_only
  selected_candidate: null
  mean_zero_extension_approved: true
  mean_zero_holm_family: nine_alternative_means_only

# 2026-11-09 사용자 결정: H1 Size 구성요소 사후 진단(비교용 단독 실행, src/evaluation/h1_size_test.py).
# 후보 A·B·C 고정, 대응 차이 2개만 검정(각 후보의 평균=0 검정 없음). 결과로 H1을 바꾸거나 후보를 추가하지 않는다.
H1_SIZE_TEST:
  approved: true
  run_category: h1_size_test
  candidates: [A, B, C]
  coefficients:  # [size, bm, mom, divisor]; size는 월별 Z(Size) 원부호
    A: [-1, 1, 1, 3]
    B: [0, 1, 1, 2]
    C: [1, 1, 1, 3]
  baseline: A
  alpha: 0.05
  reference_distribution: t
  df: T-1
  lag_rule: floor(4*(T/100)^(2/9))
  kernel: Bartlett
  small_sample_correction: false
  holm_family: two_paired_differences_only
  mean_zero_tests: false
  expected_valid_months: 251
  expected_pairs: 165331
  selected_candidate: null

# 2026-11-10 사용자 결정: OLS·Ridge 비교군(단독 실행, src/evaluation/linear_reg_test.py). 노션 11주차 5.4.
# 비교군이라 최종 선택 대상이 아니다. 통계 검정은 부스팅 비교 뒤 함께 설계한다.
LINEAR_REG_TEST:
  approved: true
  run_category: linear_reg_test
  models: [ols, ridge]
  target: raw_adjusted_monthly_return
  input_sets:
    main: [z_size, z_bm, z_mom, h3]
    reference: [h1, h3]
  variants: [raw, winsor]
  winsor_quantiles: [0.01, 0.99]
  winsor_scope: monthly_cross_section_train_target_and_inputs
  training_rows: all_inputs_and_target_present
  prediction_rows: all_stocks_with_target_return
  missing_feature_fill: common_set_zscore_then_zero_prediction_only
  validation_years: [2006, 2021]
  expected_training_pairs: 165331
  expected_validation_months: 192
  hypothesis_tests: false
  selected_candidate: null

# 2026-11-08 사용자 결정: 노션 10주차 H1과 같은 흐름(분포 -> 원값 Rank IC -> 1·99 분위수 제한 비교 -> 가설검정).
# KOSPI 상장만 보고 4개월 비상장 공백에서 EWMA 초기화. 분석은 src/evaluation/h3_analysis.py, 확정 후 features 단계에 편입.
H3_TEST:
  approved: true
  run_category: h3분석
  representative_year: 2021
  winsorization: [0.01, 0.99]
  notion_tables_path: outputs/h3_report.md
H3_HYPOTHESIS:
  approved: true  # 2026-11-08 사용자 승인(분석 결과 보고 후)
  run_category: h3가설검정
  alpha: 0.05
  reference_distribution: t
  df: T-1
  lag_rule: floor(4*(T/100)^(2/9))
  kernel: Bartlett
  small_sample_correction: false
  holm_family: H1_H4_pending
