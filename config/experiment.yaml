# 데이터 경로, 특징 조건, 모형 후보와 평가 규칙을 한곳에서 관리하는 설정 파일이다.
# 파이프라인과 각 처리 모듈에 전달할 공통 설정값을 정의한다.
# COLUMN_MAPPING의 null은 원본 열 이름 미설정 값이다.
PROJECT: KOSPI 차월 수익률 예측 연구 / 팀05
PYTHON_TARGET: '3.12.10'
PATHS:
  wide_csv:
    warmup_2000:
      adjusted_monthly_return: data/raw/warmup_2000__adjusted_monthly_return.csv
      raw_month_end_market_cap: data/raw/warmup_2000__raw_month_end_market_cap.csv
      raw_month_end_price: data/raw/warmup_2000__raw_month_end_price.csv
      raw_month_end_shares_outstanding: data/raw/warmup_2000__raw_month_end_shares_outstanding.csv
      company_name: data/raw/warmup_2000__company_name.csv
      isin: data/raw/warmup_2000__isin.csv
    train_2001_2021:
      adjusted_monthly_return: data/raw/train_2001_2021__adjusted_monthly_return.csv
      raw_month_end_market_cap: data/raw/train_2001_2021__raw_month_end_market_cap.csv
      raw_month_end_price: data/raw/train_2001_2021__raw_month_end_price.csv
      raw_month_end_shares_outstanding: data/raw/train_2001_2021__raw_month_end_shares_outstanding.csv
      company_name: data/raw/train_2001_2021__company_name.csv
      isin: data/raw/train_2001_2021__isin.csv
  security_map_csv: data/raw/security_map.csv
  dart_csv: data/raw/dart.csv
  documents_csv: data/raw/documents.csv
  panel: data/interim/panel.parquet
  asof: data/interim/asof.parquet
  eligibility: data/interim/eligibility.parquet
  trading_days: data/interim/trading_days.parquet
  h1_components: data/processed/h1_components.parquet
  mom: data/processed/mom.parquet
  h1: data/processed/h1.parquet
  h3: data/processed/h3.parquet
  h2_debt_csv: data/raw/h2/h2_debt_lag_6m_fiscal_screened_2001_2021.csv   # 팀원(src/h2/) 산출 CSV를 원본으로 취급 [2026-11-15]
  h2_monthly_csv: data/raw/h2/monthly.csv                                  # 팀원 월별 정책 점수(final_rule_v2_sensitivity)
  h2_source_dir: data/raw/h2/source/                                       # 재현용 원천(한국은행 문서 정리본·부채비율.xlsx), 계산에 안 씀
  h2_hybrid_csv: data/raw/h2/h2_debt_hybrid_candidate_2001_2021.csv       # 팀원 hybrid 부채(DART 공시일 우선 + DataGuide 6개월 지연 보완) [2026-11-21 수령]
  h2: data/processed/h2.parquet                                            # src/features/h2.py 산출(debt·policy·policy_x_debt). 2026-11-21 hybrid로 갱신(재계산 결과와 EXISTS_SAME 확인)
  h4: data/processed/h4_epu_current.parquet                               # 팀원 H4 산출(mom, epu_raw, h4_interaction) [2026-11-21 수령]. 기준월 t에 EPU(t)
  base_features: data/processed/base_features.parquet                      # src/features/base.py 산출(기본 피처, 종목×기준월) [2026-11-21]
  base_analysis: outputs/run_id/BASE_ANALYSIS/                             # src/evaluation/base_analysis.py 실행 폴더(report.md + run.json)
  features: data/processed/features.parquet
  samples: data/processed/samples.parquet
  predictions: outputs/validation/predictions.csv
  monthly_ic: outputs/validation/monthly_ic.csv
  final_test: outputs/final_test/
  models: models/
  run_records: outputs/run_id/
  model_results: outputs/model_results/   # model_test 결과(팀 공유 규격): <작성자>/<시각>_<실험>_<모델·단계>/ [2026-11-15]
  model_summary: outputs/모델_v1/          # model_test 비교 표·그림(jiun 비교 노트북 산출, 공유 안 함) [2026-11-15]
COLUMN_MAPPING:
  panel:
    stock_id: stock_id
    month: month
    return: adjusted_monthly_return
    market_cap: raw_month_end_market_cap
    price: raw_month_end_price
    shares_outstanding: raw_month_end_shares_outstanding
    company_name: company_name
    isin: isin
    # 역사적 적격성 원천은 미확보. True/False를 추정하지 않는다.
    eligible: null
  security_map:
    stock_id: null
    corp_code: null
    valid_from: null
    valid_to: null
    evidence: null
  dart:
    corp_code: null
    fiscal_period: null
    published_at: null
    receipt_id: null
    equity: null
    statement_type: null
    account: null
    unit: null
    revision: null
  documents:
    document_id: null
    source: null
    published_at: null
    raw_path: null
    collection_status: null
    meeting_date: null
    release_date_source: null
UNITS:
  return: decimal
  market_cap: KRW
  price: KRW
  shares_outstanding: shares
  equity: KRW
KEY_FORMATS:
  stock_id: 6-character string (letters allowed, leading zeros preserved)
  corp_code: 8-digit string
  month: YYYY-MM
ELIGIBILITY_SOURCE: krx_kospi_listing_delisting_lists_plus_marcap_month_end  # data/raw/상장, data/raw/상장폐지, data/raw/marcap (src/preprocessing/listing.py)
TIMEZONE: Asia/Seoul
PIT:
  cutoff: base_month calendar end
  unknown_publication_date: exclude
  unknown_time_on_month_end: next_base_month
  correction: never retroactive
  market_month_end: last trading day finalized market values
TARGET_MONTH_OFFSET: 1
H1:
  momentum_months: 11
  momentum_start_offset: -11
  momentum_end_offset: -1
  size_transform: natural_log
  ddof: 1
  min_stocks: 2
  coefficients:
    size: -1
    bm: 1
    mom: 1
  divisor: 3
  universe: same-month common valid Size/BM/Mom, independent of target y
H3:
  lambda: 0.97
  init_n_valid: 10
  init_ddof: 1
  recent_window: 12
  recent_min_valid: 10
  ddof: 1
  includes_base_month: true
  missing_month: preserve state
  reinitialize_every_12_months: false
  raw_feature: sqrt(v)
# 확장 사용 여부와 함수에 전달할 명세. null인 명세는 확정 후 설정한다.
H2:
  enabled: false   # 기준 파이프라인(src/pipeline.py) 확장 스위치. model_test 편입은 아래 정의·model_test를 따른다.
  # 2026-11-15 결정: H2 = 팀원 구현(src/h2/, 수정하지 않음) 그대로. 팀원 CSV(PATHS.h2_*)를 data/ 입력으로 쓰고 src/features/h2.py가
  # data/processed/h2.parquet를 만든다. 예전 설계(발표문 사전·시가총액 민감도)는 대체됨.
  definition:
    debt: hybrid 부채비율(DART 공시일 우선 + DataGuide 6개월 지연 보완, 2026-11-21 팀원 갱신. 이전 lag_6m은 h2_debt_csv) → 기준월마다 적격 종목 안 1%/99% 윈저 → z(ddof=0)  # src/h2/features/transforms.monthly_standardize. 팀원 표기상 PIT 전부 검증된 자료는 아님
    policy: final_rule_v2_sensitivity   # 한국은행 통화정책방향 문장 규칙 점수(완화 +1 ~ 긴축 −1), 월 공통, 발표일 < 기준월 말일
    policy_x_debt: policy × debt
    standardize_rows: eligible_panel_rows_per_base_month   # 팀원 training_frame과 같은 집합(목표값 유무로 고르지 않음)
    base_months: ['2001-01', '2021-11']                    # 기준월 2021-12(목표월 2022-01)는 테스트 기간이라 버림
  model_test:
    features: [debt, policy_x_debt]   # 개별형 입력에 붙이는 열(policy 단독은 월 공통이라 한 달 안 순위를 못 가름)
    input_transform_exception: none   # 순위 변환 예외: 두 열은 매달 순위 [−1, 1]로 바꾸지 않고 z 그대로(순위로 바꾸면 정책 세기가 사라짐)
    missing_feature_fill: 0           # 예측 때 빈 값은 0(z 평균과 같은 뜻). 학습은 관측 행만(교수님 지침)
    train_start_target_year: 2004     # 2026-11-15 결정: 부채는 목표월 2002-07부터라 2003년 H2 지수를 ① 규칙으로 못 만듦 → H2 실험의 ② 학습(모든 조합)은 2004년부터. Fold 계획은 그대로(Fold 1은 2004년만)
    stage1_rows: {h1_index: base_training_rows, h2_index: rows_with_h2_observed_all_years}   # 2026-11-15 결정: H1 지수 ①은 기존 실험과 같은 행 → 같은 지수
    index_parts: [debt, policy_x_debt]   # 지수형 H2 지수: 우리 ①단계 규칙(해마다 Y−2까지 학습, Y−1로 고름)
    index_transform: centered_raw     # 2026-11-15 결정: H2 지수는 순위로 바꾸지 않음. ① 예측 − ①(모든 입력 0) 예측(선형은 절편) → 빈 행 = 0
    input_sets:
      individual: [size, bm, mom, sigma, debt, policy_x_debt]
      index: [h1_index, sigma, h2_index]
      comparison: [[size, bm, mom, sigma], [h1_index, sigma]]   # 같은 학습 행(H2까지 관측된 행)으로 함께 실행
H4:
  enabled: false
  # 2026-11-21: 팀원 산출 data/processed/h4_epu_current.parquet 사용. 기준월 t에 EPU(t)를 붙임(팀원 의도, main 코드·README의 t−1과 다름).
  # 한계: EPU(t)는 t월 기사로 만들지만 지수 공표는 t월 이후일 수 있어 PIT 논란 가능 → 보고서에 명시, t−1 버전 강건성 점검은 선택.
  definition: {epu: 'epu_raw (월 공통, 기준월 t에 EPU(t))', interaction: 'h4_interaction = mom × epu_raw'}
  model_input_transform: none   # 두 열 모두 값 그대로(팀원 README). 월별 순위·z로 바꾸면 h4_interaction이 mom과 같아짐(EPU가 월 공통)
  search_spec: null
  uncertainty_lexicon: null
  matching_spec: null
  aggregation_spec: null
# 기본(통제) 피처 [2026-11-19~21 사용자 결정, 노션 「12주차 실행」 2-2]. 설계 A-1: H 변수와 정의가 같은 것만 뺌.
# 근거 표시: 확인 = 원문·요약 확인, 기억 = 원문 미확인, 관례 = 문헌 근거 없음, 우리 자료 = 자체 검증.
BASE_FEATURES:
  base_months: ['2000-01', '2021-11']   # 기준월 2021-12(목표월 2022-01)는 테스트 기간이라 만들지 않음(H2와 같음)
  inputs:
    marcap_dir: data/raw/marcap/                       # 일별, 2000~2021. 종목코드는 6자리로 맞춤(2000-01~05 파일은 앞 0 누락)
    kospi_index_csv: data/raw/external_data/코스피_지수_20261008162112.csv   # 월말 지수 2000-02~2021-12
    total_return_xlsx: [data/raw/external_data/1999_2010_코스피 수정수익률.xlsx, data/raw/external_data/2011_2021_코스피 수정수익률.xlsx]   # DataGuide S410007900 수정주가수익률(현금배당포함), 월간
    flows_xlsx:   # DataGuide 연간 손익·현금흐름(분기 누적의 결산 행). (기준, 재무제표) → 파일, {항목 코드: 개념}
      KGAAP_cons: {file: 1999_2010_연결_feature.xlsx, items: {'4000960002': ni_owner, '4000950000': op_income, '4000940000': sales, '4000945000': cogs, '4000961000': cfo}}
      KGAAP_sep: {file: 1999_2010_개별_feature.xlsx, items: {'1000960000': ni_owner, '1000950000': op_income, '1000940000': sales, '1000945000': cogs, '1000961000': cfo}}   # 개별은 지배·비지배 구분 없음
      KIFRS_cons: {file: 2009_2021_연결_feature.xlsx, items: {'6000908004': ni_owner, '6000906001': op_income, '6000904001': sales, '6000905001': cogs, '6000909001': cfo}}
      KIFRS_sep: {file: 2009_2021_개별_feature.xlsx, items: {'3000908004': ni_owner, '3000906001': op_income, '3000904001': sales, '3000905001': cogs, '3000909001': cfo}}
    industry:   # 2026-11-23 다운로드·결정. 금융 = KSIC 대분류 K(Static) 이고 그 결산 연도 Hist.도 금융. Hist. 빈칸은 이전 결산 값, 없으면 Static
      static_file: 업종_KSIC11_static.xlsx          # 기업정보(Static), 현재 분류(2,881사)
      ksic_section_item: CP10001394                  # 한국표준산업분류코드11차(대분류)
      hist_file: 1999_2021_시장대표업종.xlsx         # 기업정보(회계기준 전용), 결산 연도별
      hist_item: CP30900010                          # 시장 대표 업종(Hist.): KRX 분류(2017년부터 지주회사를 금융으로 분류) → 판정 보조로만
  common_rules:   # 재무 피처 공통 결정 ①~④
    filing_time: h1_equity_rule        # ① DART 최초 접수일(equity_dating), P4 마지막 거래일 이후 접수는 다음 달, P3 기준일+18개월 그 달 말일 만료
    income_period: annual              # ② 연간(결산) 값. 근거 RMW(Fama·French 2015)·GP/A(Novy-Marx 2013) 원 정의
    statement: h1_equity_tier          # ③ 연결 우선(H1 자기자본 T1→T1D→T2→T3와 같은 재무제표). 한 비율 안 분자·분모는 같은 재무제표
    gaap_ifrs_boundary: '2010-12'      # ④ 회계기간 2010-12까지 K-GAAP 우선, 이후 K-IFRS (dataguide_extract.LAST_GAAP_MONTH)
  daily_rules:
    trading_day: volume_positive       # 거래량 0(거래정지)인 날은 일별 통계에서 뺌
    adjusted_price: cumulative_changes_ratio   # marcap 일수익률(분할 보정 확인, 2018-05-04 삼성전자)을 누적해 수정주가
    ivol_min_days: 15                  # 관례값(근거 미확인): 그 달 거래일이 15일 미만이면 고유 변동성 미산출
    market_return: kospi_value_weighted_previous_day_marcap   # B-3: marcap KOSPI 전 종목, 전일 시가총액 가중
  features:   # 이름: [정의, 기대 부호(단독 IC 점검용), 근거]
    str: ['r_t (교수님 수정수익률)', '-', 'Jegadeesh 1990 (확인)']
    ltr: ['t-35~t-12 24개월 누적수익률, 하나라도 결측이면 미산출', '-', 'GHZ mom36m = GKX 피처 (기억)']
    high52: ['t월 말 수정종가 / t-11~t 수정고가 최댓값, 12개월 모두 거래 필요', '+', 'George·Hwang 2004 (확인)']
    turnover: ['t-2~t 평균(월 거래량 / 월말 상장주식수), 3개월 모두 필요', '-', 'Datar·Naik·Radcliffe 1998, GHZ turn (기억)']
    ln_dvol: ['ln(t월 거래대금 합)', '-', 'Brennan·Chordia·Subrahmanyam 1998 (확인)']
    illiq: ['t월 거래일 평균 |일수익률| / 거래대금', '+', 'Amihud 2002 (확인)']
    ivol: ['t월 일별 CAPM 잔차 표준편차(ddof=2)', '-', 'Ang·Hodrick·Xing·Zhang 2006 (확인), 3요인 대신 CAPM은 자료 제약']
    max_ret: ['t월 최대 일수익률', '-', 'Bali·Cakici·Whitelaw 2011 (확인), 한국 Nartea·Wu·Liu 2014 (확인)']
    beta: ['지난 156주 주별 수익률 회귀 기울기, 최소 52주', '-', 'GHZ beta(Fama·MacBeth 1973) = GKX 피처 (기억)']
    ln_price: ['ln(t월 말 종가)', '?', '관례']
    roa: ['지배주주 순이익(연간) / 전년 말 총자산(같은 재무제표)', '+', 'GHZ roaq = GKX 피처 (기억), 원 정의는 분기']
    ep: ['지배주주 순이익(연간) / t월 말 시가총액, 음수 그대로', '+', 'Basu 1977 (확인), GHZ ep (기억)']
    dy: ['최근 12개월 (월 배당수익 × 전월 말 시가총액) 합 / t월 말 시가총액, 12개월 모두 필요', '+', 'Litzenberger·Ramaswamy 1979 (확인), 계산 방식은 우리 자료 검증(2026-11-21)']
    asset_growth: ['총자산(당해 말) / 전년 말 총자산 − 1, 같은 재무제표. 금융업 결측', '-', 'Cooper·Gulen·Schill 2008 (요약 확인)']
    gpa: ['(매출 − 매출원가) / 당해 말 총자산. 매출원가 0·빈칸 결측, 금융업 결측', '+', 'Novy-Marx 2013 (원문 확인 2026-11-23: (REVT−COGS)/AT, 자산 시차 없음, SIC 6 금융업 제외)']
    cfp: ['영업현금흐름(연간) / t월 말 시가총액, 음수 그대로. 금융업 결측', '+', 'Desai·Rajgopal·Venkatachalam 2004 CFO/P (기억)']
    sp: ['매출(연간) / t월 말 시가총액. 금융업 결측', '+', 'Barbee 등 1996, GHZ sp (기억)']
    pct_accruals: ['(지배 순이익 − 영업현금흐름) / |지배 순이익|, 순이익 0 결측. 금융업 결측', '-', 'Hafzalla·Lundholm·Van Winkle 2011 (원문 미확인). 정의는 Chen·Zimmermann Open Source Asset Pricing PctAcc 문서 확인(2026-11-23): (ib − oancf)/|ib|. 지배 순이익을 ib 대응으로 씀(Compustat ib는 비지배 차감 후 — 기억)']
    sales_growth: ['매출 / 전년 매출 − 1, 같은 재무제표, 전년 매출 0 이하 결측. 금융업 결측', '-', 'Lakonishok·Shleifer·Vishny 1994, GHZ sgr (기억)']
    rmw: ['영업이익(연간, ROA·E/P와 같은 사업보고서) / B/M과 같은 자기자본(asof.parquet, t월). 자본 0 이하(자본잠식)는 결측. 금융업 포함', '+', 'Fama·French 2015 RMW(원 정의는 이자비용도 뺌, 1999~2010 이자비용 없어 영업이익으로 통일: 팀원 결정 2026-11-21). 자본 양수·금융업 포함은 Ken French 데이터 라이브러리 OP 포함 조건(확인)']
    mkt_ret: ['KOSPI t월 수익률(월 공통)', 'none', 'Welch·Goyal 2008 (확인)']
    mkt_ret3: ['KOSPI t-2~t 누적수익률(월 공통)', 'none', 'Welch·Goyal 2008 (확인)']
    mkt_vol12: ['KOSPI t-11~t 월수익률 표준편차 ddof=1(월 공통)', 'none', 'Welch·Goyal 2008 (확인)']
    breadth: ['t월 적격 종목 중 r_t > 0 비율(월 공통)', 'none', '관례']
  market_common: [mkt_ret, mkt_ret3, mkt_vol12, breadth]   # D-2: 순위 변환 예외(값 그대로), 부스팅에만 입력
  overlap_rule: keep_all_model_handles   # 2026-11-21 사용자 A: 상관이 높아도 미리 빼지 않고 모두 넣음(GKX 2020: 94개 전부, 규제·차원축소·트리가 처리). 결과 보고 넣었다 빼지 않음
  check_items: [ltr_sign, ln_price_basis, ln_dvol_illiq, ivol_max, illiq_size, roa_ep]   # BASE_ANALYSIS 20261121T023832에서 확인 필요로 나온 항목
  pending:   # 이번 범위 밖
    industry_required: []   # 업종 자료 받음(2026-11-23) → features.asset_growth~sales_growth
    teammate_answer: []   # rmw 답변 받음(2026-11-21) → features.rmw
  model_input:   # D-1·D-2 (모델 연결은 다음 범위)
    missing: mean_fill_train_and_predict   # 2026-11-21 사용자: 이번 실행은 교수님 지침의 예외로 관측값 변환 뒤 빈 칸 0(그 달 평균), 학습에도 사용. 근거 Chen·McCoy 2024 JFE, GKX 2020. 교수님 확인 전
    exclude_train_target_months: ['2001-01', '2001-02']   # 시장 변동성 12개월 창 미충족(월 공통이라 평균으로 못 채움) → 학습에서 뺌
    linear_transform: retune_rank_z_winsor_z   # 확장 피처로 다시 비교 전 임시값 winsor_zscore
    boosting_transform: rank
    linear:   # 2026-11-21 사용자: 선형은 비선형과 비교할 기준선. ENet 추가 안 함
      models: [ols, ridge]
      targets: [winsor_1_99, monthly_zscore]   # 원값 제외(4개 입력 결과에서 항상 최저)
      losses: [mse, huber_q999, huber_sigma135]
      ridge_lambda: yearly_inner_validation   # MODEL_GRID.ridge_lambdas 6개 중 해마다 내부 검증으로 선택
      h3_lambda: model_grid_10_candidates
      transforms_compared: [rank, zscore, winsor_zscore]
    lightgbm:   # 2026-11-21 사용자. 로컬 CPU
      kinds: [regression, rank_regression]
      depths: [3]                          # 이전 1등(두 종류 모두). 깊이 4는 나중에 검토
      regression_targets: [winsor_1_99, monthly_zscore]   # 입력이 바뀌어 이전 순위가 유지된다는 보장이 없어 4개 조합 모두
      regression_losses: [mse, huber_sigma135]
      learning_rates: [0.01, 0.05]          # 교수님 피드백 2(학습률·트리 수)
      tree_count: [yearly_inner_validation, fixed_500]   # 1000개까지 학습해 두 방식 모두 보고
      h3_spans: model_grid_boosting_h3_spans   # 12·36·60
      input_transform: rank
    xgboost:   # 2026-11-21 사용자. Colab GPU
      kinds: [regression, pairwise, rank_regression]
      depths: [3]
      regression_targets: [winsor_1_99, monthly_zscore]
      regression_losses: [mse, huber_sigma135]
      l2: {regression: [0], pairwise: [0, 5], rank_regression: [0, 5]}   # 보류였던 L2 0 vs 5 재시험(H4 편입 뒤)
      learning_rates: [0.01, 0.05]
      tree_count: [yearly_inner_validation, fixed_500]
      h3_spans: model_grid_boosting_h3_spans
      input_transform: rank
    main_run:   # 5 본 실행(2026-11-22 사용자). 근거는 우리 자료(16 Fold 바깥 검증, 0.002 미만이면 단순한 쪽)
      kinds:   # 이름: [목표값, 손실]. 선형·일반 회귀 제외(basefeat_v2, 순위 목표가 lr 0.01에서 +0.005~0.010)
        lgb_rankreg: [percentile, mse]       # 로컬 CPU
        xgb_rankreg: [percentile, mse]       # Colab GPU
        xgb_pairwise: [decile, pairwise]     # Colab GPU
      depth: 3                 # tune_lgb_v1·tune_xgb_v1: 세 모델 모두 3 > 4(깊이 4는 학습−검증 차이만 커짐)
      learning_rate: 0.01      # basefeat_v2: 0.01 > 0.05
      trees: 500               # 고정. 해마다 선택은 어디서도 1등 아님, 500·1000·1500 차이 < 0.002(LGB 1000은 +0.00196)
      xgb_l2: 0                # 0 vs 5 차이 0.0002·0.0004(코드 기본값 0). 입력이 늘면 다시 봄
      pairwise_pairs: {lambdarank_pair_method: mean, lambdarank_num_pair_per_sample: 8, seed: 0}   # pairwise_check_v1: 전체 쌍 0.1156 vs 표본 8개 0.1173(시드 sd 0.0006), 33분→8분
      save_models: true        # Fold마다 고른 모델(트리 500개) 저장 → SHAP
      shap:
        sets: [base, base+h1+h3+h2+h4]          # 기본 세트·주 세트
        interaction_sets: [base+h1+h3+h2+h4]    # 상호작용은 주 세트만, 세 모델 모두(LGB는 shap 패키지)
        rows: outer_validation                  # 각 Fold 모델로 그 Fold 바깥 검증 행(2006~2021 이어 붙임)
PERIODS:
  warmup:
  - 2000
  - 2000
  train:
  - 2001
  - 2021
  test:
  - 2022
  - 2025
FOLDS:
  split_key: target_month
  train_start_year: 2001
  initial_train_end_year: 2005
  first_validation_year: 2006
  last_validation_year: 2021
  min_external_train_years: 5
OLS:
  fit_intercept: true
# 2026-11-10 사용자 결정: 후보는 glmnet 방식 λ(평균 오차 기준 벌점)로 정의하고 sklearn alpha = λ × 학습 행 수로 바꾼다.
# 확장 창에서 학습 행이 3만→15만으로 늘어도 같은 λ면 같은 세기의 벌점이 되도록 하기 위함(이전 alphas 0.01~100은 사실상 OLS).
# λ는 Fold마다 학습 기간 마지막 1년을 내부 검증으로 떼어 평균 Rank IC로 고른다. 바깥 검증 연도는 선택에 쓰지 않는다.
RIDGE:
  fit_intercept: true
  lambdas:
  - 0.001
  - 0.01
  - 0.1
  - 1
  - 10
  alpha_scaling: lambda_times_train_rows
  # 2026-11-10: 입력은 Fold 학습 행의 평균·표준편차(ddof=0)로 표준화한 뒤 벌점(glmnet standardize=TRUE, ESL 3.4.1). 계수는 원래 크기로도 보고.
  standardize: train_rows_mean_sd_ddof0
  inner_validation_years: 1
  selection_metric: mean_rank_ic
  tie_rule: larger_lambda
MLP:
  hidden_layer_sizes:
  - - 32
  - - 64
    - 32
  activation: relu
  solver: adam
  learning_rate_init: 0.001
  batch_size: 256
  max_iter: 500
  alphas:
  - 0.0001
  - 0.01
  random_state: 42
  shuffle: false
  early_stopping: false
  tie_rule: fewer_total_hidden_nodes_then_larger_alpha
# 2026-11-12 사용자 결정(교수님 피드백 11-12 반영): 모델 비교 전체 설계. 검증(2006~2021)까지만, 테스트는 H2·H4 이후 최종 선택 때.
# 원칙: 가중치는 사람이 정하지 않고 모델이 학습, 후보는 모두 돌려 보고, 조합 간에는 입력 열만 다르고 나머지는 모두 같게.
# 근거 표기: [GKX] Gu·Kelly·Xiu(2020, RFS) 본문·인터넷 부록, [LWZ] Leippold·Wang·Zhou 중국 시장 부록,
#   [Breiman] Stacked Regressions(1996), [LGB]/[XGB] 공식 조정 가이드·설치 버전 기본값, [자료] 이 프로젝트 결과, [결정] 근거 문헌 없는 사용자 결정.
MODEL_GRID:
  approved: true
  hypotheses: [H1, H3]                      # H2·H4는 팀원 자료 이후 같은 설계로 추가
  # --- 표본과 기간 ---
  train_start_target_year: 2001              # 2026-11-16 결정: 지수형을 빼서 2003년(지수형 ① 때문, 2026-11-13 A2)일 이유가 없어짐 → 자료가 있는 2001년부터.
                                             # 비교(tuning_window.csv): 2001 vs 2003 차이 선형 +0.0004~0.0006, LightGBM −0.0018(모두 0.002 미만)
  first_validation_year: 2006                # 바깥 검증 2006~2021, 16개 Fold
  last_validation_year: 2021
  inner_validation_years: 1                  # 학습 기간 마지막 1년으로 조정값 선택 [GKX §1.1 검증으로 선택, 길이는 결정]
  min_inner_train_years: 5                   # 기존 최소 5년 규칙
  min_inner_train_exceptions: [1]            # Fold 1(내부 학습 2001~2004, 4년)만 예외(2003 시작 때는 Fold 1~3)
  tuning_selection: joint_grid_max_inner_ic  # 한 모델 안의 조정값(H3 λ × Ridge λ, H3 λ × 트리 수)은 모든 조합 중 내부 검증 IC 최고 한 쌍 [GKX §1.1, Table A.5]
  tie_rules:                                 # 내부 검증 IC가 정확히 같을 때. 근거 문헌 없음, 11주차 "단순한 모델" 원칙 계승 [결정 2026-11-13 A4]
    trees: fewer
    ridge_lambda: larger
    h3_span: longer                          # 원래 정의(0.97) 쪽. 함께 고를 때는 모델 쪽 규칙 먼저, 그다음 H3
  refit_after_selection: false               # 고른 뒤 다시 학습하지 않음, 모든 모델 같은 학습 기간 [GKX §1.1, LWZ A.1]
  training_rows: common_h1_h3_target         # 관측값만으로 학습: H1·H3·목표값이 모두 관측된 같은 행(조합 간 동일) [교수님 지침]
  prediction_rows: all_stocks_with_target    # 수익률 있는 모든 종목을 예측, 빠진 특징만 이때 채움 [교수님 지침]. 평가는 전체 종목·공통 표본 둘 다
  target_returns_unchanged: true             # 수익률 0·결측은 바꾸지 않음 [교수님 지침]
  # --- 입력 조합 ---
  components: [size, bm, mom, sigma]         # 원값(Size는 원부호, σ는 H3의 EWMA 변동성). 아래 변환을 거쳐 입력
  input_transform: monthly_rank_pm1          # 매달 적격·산출 종목 안 순위(평균 동순위) r → 2r/(N+1) − 1, 범위 (−1, 1)
                                             # [GKX 각주 29: Kelly·Pruitt·Su 2019, Freyberger·Neuhierl·Weber 2020; GKX 부록 식 A.1]
                                             # 10·11주차 Z 점수 판은 비교군으로만 남김(2026-11-13 결정)
  h3_fixed: {initial_returns: 10, recent_window: 12, recent_min_valid: 10, delisting_gap_reset_months: 4}   # 확정 결정, 바꾸지 않음
  h3_lambda_learning:                        # λ만 자료로 학습. 모델·Fold마다 내부 검증으로 선택 [교수님 피드백; RiskMetrics §5.3.2도 λ를 자료로 탐색]
    span_months: [12, 18, 24, 30, 36, 42, 48, 54, 60]   # λ = 1 − 2/(N+1) (pandas span 정의). 12 ≈ 0.846, 60 ≈ 0.967
                                             # 범위: Blitz & van Vliet(2007) 강건성 1년 ~ 현재 값 0.97(≈Baker·Bradley·Wurgler 2011의 60개월)
    include_current_value: 0.97              # 10번째 후보. span 66(λ 0.9701) 대신 현재 값 0.97 그대로(span ≈ 65.7개월)
  index_transform: monthly_rank_pm1          # 지수형 H1 지수(①의 예측값)도 매달 순위 [−1,1]로 바꿔 ②에 넣음 [결정 2026-11-13]
  missing_feature_fill: 0                    # 예측 행에서만. 순위 척도의 단면 중앙값 = 0 [채우는 값: GKX 단면 중앙값 대체, Chen·McCoy §3.3]
  individual_sets: all_nonempty_subsets      # 개별형 15개
  index_sets:                                # 지수형 3개, H1 지수 = 1단계 모델(Size·B/M·Mom)의 예측
    - [h1_index]
    - [sigma]                                # H3는 구성요소가 σ 하나라 지수 = σ(1단계 모델 없음)
    - [h1_index, sigma]
  index_stage1_model: same_as_stage2         # A안: 1단계와 2단계가 같은 모델·설정 [결정; Breiman은 다른 입력 묶음 쌓기 선례 아님]
  index_stage1_out_of_sample: prior_years_expanding   # 각 해의 지수는 그 이전 해 전체로 학습한 1단계로 만듦 [Breiman 교차검증 원리]
  # --- 회귀 모델 ---
  regression_targets: [raw, winsor_1_99, monthly_zscore]   # [자료 11주차, Cakici·Zaremba 요약 글(원문 미확인)]
  regression_losses: [mse, huber_q999, huber_sigma135]
  target_transform_basis: monthly_training_rows   # 윈저 경계·월별 표준화·10분위·백분위 모두 그 달 학습 행 안에서 계산. 평가는 항상 원수익률
  huber_q999_quantile: 0.999                 # |변환된 학습 목표값 - 그 달 평균|의 분위수, Fold 학습 행 [GKX Table A.5; 대상은 원문 미기재라 해석]
  huber_sigma_epsilon: 1.35                  # δ = 1.35 × σ, σ는 scikit-learn HuberRegressor 방식, 조합마다 추정 [LWZ Table A.2, scikit-learn 기본값]
                                             # 부스팅의 σ는 같은 Fold·조합·목표값의 선형 Huber(OLS) 추정값을 가져옴
  linear_models: [ols, ridge]
  ridge_lambdas: [0.0001, 0.001, 0.01, 0.1, 1, 10]   # GKX·LWZ 벌점 범위 10⁻⁴~10⁻¹ + 11주차에서 자주 뽑힌 1·10 [2026-11-13 A5]
                                             # GKX 범위는 ENet(L1+L2) 기준이라 순수 Ridge와 다름. alpha = λ × 학습 행 수(기존 방식)
  ridge_input_standardize: false             # 입력이 이미 순위 [−1,1]이라 추가 표준화 없음 [GKX와 같음; 2026-11-13]. OLS는 원래 표준화 무관
  # --- 순위 모델 ---
  rank_models: [pairwise, rank_regression]  # pairwise는 XGBoost만(LightGBM에 없음) [2026-11-13 결정, Poh 외 2020]
                                             # lambdarank(XGB rank:ndcg, LGB lambdarank) 제외 [결정 2026-11-14]. 근거(자료): LGB lambdarank
                                             # lr 0.01·깊이 1~3·Fold 16·8 측정 6회 모두 최고 내부 IC 음수(−0.007~−0.052), XGB도 Colab 1회 0.003.
                                             # 같은 10분위 정답의 pairwise는 +0.043 → 상위 등급 가중이 전체 순서(Rank IC)와 반대로 학습(추정)
  rank_label: monthly_decile_0_9             # pairwise [Poh 외 2020 10분위; 5분위 대체 2026-11-13]
  rank_pairs: all                            # 두 순위 손실 모두 전체 쌍. XGB topk·쌍 수 최대, LGB truncation_level 1000 [결정; mean 추출은 OS별 결과 달라짐(XGB 문서)]
  rank_regression_target: monthly_percentile # 0~1, 손실 MSE(값이 묶여 Huber 불필요)
  # --- 부스팅 설정 ---
  boosting_regression_targets: [winsor_1_99, monthly_zscore]   # 부스팅 회귀만(선형은 위 3종 유지) [결정 2026-11-14: 계산량]
                                             # 근거(자료): 선형 4개 입력에서 원값이 6줄 모두 최저, Huber②에서는 원값≈윈저
  boosting_regression_losses: [mse, huber_sigma135]   # Huber① 제외 [결정 2026-11-14]. 근거(자료): 선형에서 Huber①−MSE +0.001~0.003,
                                             # 직선 벌점 행 약 0.1%라 사실상 MSE; GKX Table A.1 Huber 개선 작음(원문)
  boosting_h3_spans: [12, 36, 60]            # 부스팅의 H3 λ 후보(선형은 위 10개 유지) [결정 2026-11-14: 계산량·근거]
                                             # 원전 기간만: Blitz & van Vliet(2007) 강건성 1년·본문 3년, Baker·Bradley·Wurgler(2011) 5년(모두 원문).
                                             # 사이 값(18~54)은 6개월 간격 보간, 0.97은 월별 직접 근거 없음(§3.2). 선택은 그대로 내부 검증 함께 고르기
  libraries: [xgboost, lightgbm]
  depths: [1, 2, 3]                          # [GKX 1~2 ∪ LWZ 1~3]
  boosting_followup_depths: {xgb_pairwise: [4], xgb_rankreg: [4], lgb_rankreg: [4]}
                                             # 후속 튜닝 1회 [결정 2026-11-14, 원칙 "깊이 3이 자주 이기면 깊이 4 검토"].
                                             # 근거(자료, 개별형 1차): 순위 정답 3종 모두 깊이 1→2→3 IC 상승(예: XGB 순위회귀
                                             # 0.0806→0.0840→0.0863), 회귀 2종은 상승 없음 → 순위 3종만. 4는 관례상 다음 칸.
                                             # 원래 설계 결과와 따로 실행·저장(폴더 끝 _d4), 학습−검증 차이 함께 보고
  learning_rates: [0.01]                     # [GKX, LWZ 후보 {0.01, 0.1}] 중 0.01만 [결정 2026-11-14: 계산량]
                                             # 근거(자료, 12회 측정): lr 0.01의 트리 10개 ≈ lr 0.1의 트리 1개(고른 트리 ~10배, 최고 IC 차 ≤0.003),
                                             # 최고점이 대부분 작은 트리 수라 촘촘한 0.01 선택. 고른 트리가 1000 근처에 몰리면 후속으로 0.1 추가
  hyperparameter_reporting: all_candidates   # 6개 모두 보고, 내부 검증으로 고르지 않음 [교수님 피드백 2]
  max_trees: 1000                            # [GKX·LWZ 1~1000]
  tree_count_selection: best_inner_validation_ic_over_all_trees   # 1000개 모두 학습, 인내값 없음
  lightgbm_num_leaves: two_power_depth       # max_depth=d, num_leaves=2^d [LGB 조정 가이드]
  min_hessian_in_leaf: 0.001                 # XGB min_child_weight, LGB min_sum_hessian_in_leaf [LGB 기본값; 0이면 lambdarank 오류(실측, 제외 전)]
  min_data_in_leaf: 1
  l2: 0                                      # GKX Algorithm 4 기본형(추가 규제 없음). GKX·LWZ·Poh 모두 L2 미조정. 규제 후보는 나중에 검토(2026-11-13)
  l1: 0
  subsample: 1.0                             # 표본 추출 없음 → 난수 없음
  colsample: 1.0
  max_bin: 256                               # XGB 기본 256, LGB 기본 255를 256으로 맞춤 [결정]
  device: {xgboost: cuda, lightgbm: cpu}     # [결정 2026-11-14] 고를 때 쓴 장치 = 최종 모델 장치(XGB는 최종 모델도 GPU, 기존 "최종 CPU" 변경).
                                             # 근거(자료): 같은 설정에서 GPU·CPU가 다른 나무(내부 IC 0.056 vs 0.051, 예측 차 최대 0.30),
                                             # GPU 반복은 차이 0.0. 속도: XGB pairwise GPU 55초 vs CPU 약 370초(추정). LGB GPU는 max_bin 256에서
                                             # 'bin size 257' 오류로 불가 → CPU
  # --- 보고와 선택 ---
  report_metrics: [mean_ic, ic_sd, icir, ic_positive_share, r2_pct]   # 학습·바깥 검증과 그 차이, R²는 수익률 단위 예측만 [GKX 식 19]
  report_periods: [[2006, 2010], [2011, 2021], [2018, 2021]]
  # 바깥 검증에서 한 달 예측이 모두 같으면(constant_score) IC = 0으로 센다 [결정 2026-11-15 A, 관례적 선택].
  # 근거(논리): 순위를 구분하지 못한 달을 빼면 평균이 부풀고 모델마다 평가 달 수가 달라짐. 발생: XGB 회귀·표준화·Huber②·
  # 깊이 1·[H1 지수]의 2021-01~07(트리 1개, 분할 기준이 지수 끝값). 해당 달은 monthly_ic.csv에 reason=constant_score로 남는다

  test_list: best_per_model_family_full_inputs   # 모델 종류별 바깥 검증 IC 1등 설정(입력 H1+H3 기준)
  primary_model: best_validation_mean_ic         # 11주차 0.005·ICIR 규칙 대체
EVALUATION:
  method: monthly_spearman
  tie_method: average
  min_valid_stocks: 3
  constant_rank: missing_with_reason
  aggregation: equal_weight_common_valid_months
  candidate_failure: record_and_exclude
  tie_tolerance: null
SAMPLE_ID: null
REPRODUCIBILITY_PREDICTION_ATOL: 1.0e-10
FINAL_TEST_ENABLED: false
TEST_ACCESS_REQUIRES_FROZEN_CONFIG: true

# 2026-11-05 사용자 승인: 2단계, 대표 연도 2021. 이후 단계는 별도 승인.
