    release_date_source: null
UNITS:
  return: decimal
  market_cap: KRW
  price: KRW
  shares_outstanding: shares
  equity: KRW
KEY_FORMATS:
  stock_id: 6-character string (letters allowed, leading zeros preserved)
  corp_code: 8-digit string
  month: YYYY-MM
ELIGIBILITY_SOURCE: krx_kospi_listing_delisting_lists_plus_marcap_month_end  # data/raw/상장, data/raw/상장폐지, data/raw/marcap (src/preprocessing/listing.py)
TIMEZONE: Asia/Seoul
PIT:
  cutoff: base_month calendar end
  unknown_publication_date: exclude
  unknown_time_on_month_end: next_base_month
  correction: never retroactive
  market_month_end: last trading day finalized market values
TARGET_MONTH_OFFSET: 1
H1:
  momentum_months: 11
  momentum_start_offset: -11
  momentum_end_offset: -1
  size_transform: natural_log
  ddof: 1
  min_stocks: 2
  coefficients:
    size: -1
    bm: 1
    mom: 1
  divisor: 3
  universe: same-month common valid Size/BM/Mom, independent of target y
H3:
  lambda: 0.97
  init_n_valid: 10
  init_ddof: 1
  recent_window: 12
  recent_min_valid: 10
  ddof: 1
  includes_base_month: true
  missing_month: preserve state
  reinitialize_every_12_months: false
  raw_feature: sqrt(v)
# 확장 사용 여부와 함수에 전달할 명세. null인 명세는 확정 후 설정한다.
H2:
  enabled: false
  lexicon: null
  context_rules: null
  publication_date_rule:
    preferred: actual_release_date
    fallback: meeting_date_proxy
    fallback_flag_required: true
    unknown_time_on_month_end: next_base_month
  sensitivity_spec:
    source: panel_market_cap
    transform: natural_log
    standardize: monthly_zscore
    ddof: 1
    direction: smaller_is_higher
H4:
  enabled: false
  search_spec: null
  uncertainty_lexicon: null
  matching_spec: null
  aggregation_spec: null
PERIODS:
  warmup:
  - 2000
  - 2000
  train:
  - 2001
  - 2021
  test:
  - 2022
  - 2025
FOLDS:
  split_key: target_month
  train_start_year: 2001
  initial_train_end_year: 2005
  first_validation_year: 2006
  last_validation_year: 2021
  min_external_train_years: 5
OLS:
  fit_intercept: true
# 2026-11-10 사용자 결정: 후보는 glmnet 방식 λ(평균 오차 기준 벌점)로 정의하고 sklearn alpha = λ × 학습 행 수로 바꾼다.
# 확장 창에서 학습 행이 3만→15만으로 늘어도 같은 λ면 같은 세기의 벌점이 되도록 하기 위함(이전 alphas 0.01~100은 사실상 OLS).
# λ는 Fold마다 학습 기간 마지막 1년을 내부 검증으로 떼어 평균 Rank IC로 고른다. 바깥 검증 연도는 선택에 쓰지 않는다.
RIDGE:
  fit_intercept: true
  lambdas:
  - 0.001
  - 0.01
  - 0.1
  - 1
  - 10
  alpha_scaling: lambda_times_train_rows
  # 2026-11-10: 입력은 Fold 학습 행의 평균·표준편차(ddof=0)로 표준화한 뒤 벌점(glmnet standardize=TRUE, ESL 3.4.1). 계수는 원래 크기로도 보고.
  standardize: train_rows_mean_sd_ddof0
  inner_validation_years: 1
  selection_metric: mean_rank_ic
  tie_rule: larger_lambda
MLP:
  hidden_layer_sizes:
  - - 32
  - - 64
    - 32
  activation: relu
  solver: adam
  learning_rate_init: 0.001
  batch_size: 256
  max_iter: 500
  alphas:
  - 0.0001
  - 0.01
  random_state: 42
  shuffle: false
  early_stopping: false
  tie_rule: fewer_total_hidden_nodes_then_larger_alpha
# 2026-11-12 사용자 결정(교수님 피드백 11-12 반영): 모델 비교 전체 설계. 검증(2006~2021)까지만, 테스트는 H2·H4 이후 최종 선택 때.
# 원칙: 가중치는 사람이 정하지 않고 모델이 학습, 후보는 모두 돌려 보고, 조합 간에는 입력 열만 다르고 나머지는 모두 같게.
# 근거 표기: [GKX] Gu·Kelly·Xiu(2020, RFS) 본문·인터넷 부록, [LWZ] Leippold·Wang·Zhou 중국 시장 부록,
#   [Breiman] Stacked Regressions(1996), [LGB]/[XGB] 공식 조정 가이드·설치 버전 기본값, [자료] 이 프로젝트 결과, [결정] 근거 문헌 없는 사용자 결정.
MODEL_GRID:
  approved: true
  hypotheses: [H1, H3]                      # H2·H4는 팀원 자료 이후 같은 설계로 추가
  # --- 표본과 기간 ---
  train_start_target_year: 2003              # 지수형 ①도 조정값을 내부 검증으로 고르므로 H1 지수는 2003년부터(①: 학습 2001·검증 2002).
                                             # 모든 조합을 같은 행으로 맞춰 2003년부터 [결정 2026-11-13 A2]. 2001·2002는 ①의 학습·검증에만 쓰임
  first_validation_year: 2006                # 바깥 검증 2006~2021, 16개 Fold
  last_validation_year: 2021
  inner_validation_years: 1                  # 학습 기간 마지막 1년으로 조정값 선택 [GKX §1.1 검증으로 선택, 길이는 결정]
  min_inner_train_years: 5                   # 기존 최소 5년 규칙
  min_inner_train_exceptions: [1, 2, 3]      # Fold 1~3(내부 학습 2·3·4년)은 예외로 기록 [결정]
  tuning_selection: joint_grid_max_inner_ic  # 한 모델 안의 조정값(H3 λ × Ridge λ, H3 λ × 트리 수)은 모든 조합 중 내부 검증 IC 최고 한 쌍 [GKX §1.1, Table A.5]
  tie_rules:                                 # 내부 검증 IC가 정확히 같을 때. 근거 문헌 없음, 11주차 "단순한 모델" 원칙 계승 [결정 2026-11-13 A4]
    trees: fewer
    ridge_lambda: larger
    h3_span: longer                          # 원래 정의(0.97) 쪽. 함께 고를 때는 모델 쪽 규칙 먼저, 그다음 H3
  refit_after_selection: false               # 고른 뒤 다시 학습하지 않음, 모든 모델 같은 학습 기간 [GKX §1.1, LWZ A.1]
  training_rows: common_h1_h3_target         # 관측값만으로 학습: H1·H3·목표값이 모두 관측된 같은 행(조합 간 동일) [교수님 지침]
  prediction_rows: all_stocks_with_target    # 수익률 있는 모든 종목을 예측, 빠진 특징만 이때 채움 [교수님 지침]. 평가는 전체 종목·공통 표본 둘 다
  target_returns_unchanged: true             # 수익률 0·결측은 바꾸지 않음 [교수님 지침]
  # --- 입력 조합 ---
  components: [size, bm, mom, sigma]         # 원값(Size는 원부호, σ는 H3의 EWMA 변동성). 아래 변환을 거쳐 입력
  input_transform: monthly_rank_pm1          # 매달 적격·산출 종목 안 순위(평균 동순위) r → 2r/(N+1) − 1, 범위 (−1, 1)
                                             # [GKX 각주 29: Kelly·Pruitt·Su 2019, Freyberger·Neuhierl·Weber 2020; GKX 부록 식 A.1]
                                             # 10·11주차 Z 점수 판은 비교군으로만 남김(2026-11-13 결정)
  h3_fixed: {initial_returns: 10, recent_window: 12, recent_min_valid: 10, delisting_gap_reset_months: 4}   # 확정 결정, 바꾸지 않음
  h3_lambda_learning:                        # λ만 자료로 학습. 모델·Fold마다 내부 검증으로 선택 [교수님 피드백; RiskMetrics §5.3.2도 λ를 자료로 탐색]
    span_months: [12, 18, 24, 30, 36, 42, 48, 54, 60]   # λ = 1 − 2/(N+1) (pandas span 정의). 12 ≈ 0.846, 60 ≈ 0.967
                                             # 범위: Blitz & van Vliet(2007) 강건성 1년 ~ 현재 값 0.97(≈Baker·Bradley·Wurgler 2011의 60개월)
    include_current_value: 0.97              # 10번째 후보. span 66(λ 0.9701) 대신 현재 값 0.97 그대로(span ≈ 65.7개월)
  index_transform: monthly_rank_pm1          # 지수형 H1 지수(①의 예측값)도 매달 순위 [−1,1]로 바꿔 ②에 넣음 [결정 2026-11-13]
  missing_feature_fill: 0                    # 예측 행에서만. 순위 척도의 단면 중앙값 = 0 [채우는 값: GKX 단면 중앙값 대체, Chen·McCoy §3.3]
  individual_sets: all_nonempty_subsets      # 개별형 15개
  index_sets:                                # 지수형 3개, H1 지수 = 1단계 모델(Size·B/M·Mom)의 예측
    - [h1_index]
    - [sigma]                                # H3는 구성요소가 σ 하나라 지수 = σ(1단계 모델 없음)
    - [h1_index, sigma]
  index_stage1_model: same_as_stage2         # A안: 1단계와 2단계가 같은 모델·설정 [결정; Breiman은 다른 입력 묶음 쌓기 선례 아님]
  index_stage1_out_of_sample: prior_years_expanding   # 각 해의 지수는 그 이전 해 전체로 학습한 1단계로 만듦 [Breiman 교차검증 원리]
  # --- 회귀 모델 ---
  regression_targets: [raw, winsor_1_99, monthly_zscore]   # [자료 11주차, Cakici·Zaremba 요약 글(원문 미확인)]
  regression_losses: [mse, huber_q999, huber_sigma135]
  target_transform_basis: monthly_training_rows   # 윈저 경계·월별 표준화·10분위·백분위 모두 그 달 학습 행 안에서 계산. 평가는 항상 원수익률
  huber_q999_quantile: 0.999                 # |변환된 학습 목표값 - 그 달 평균|의 분위수, Fold 학습 행 [GKX Table A.5; 대상은 원문 미기재라 해석]
  huber_sigma_epsilon: 1.35                  # δ = 1.35 × σ, σ는 scikit-learn HuberRegressor 방식, 조합마다 추정 [LWZ Table A.2, scikit-learn 기본값]
                                             # 부스팅의 σ는 같은 Fold·조합·목표값의 선형 Huber(OLS) 추정값을 가져옴
  linear_models: [ols, ridge]
  ridge_lambdas: [0.0001, 0.001, 0.01, 0.1, 1, 10]   # GKX·LWZ 벌점 범위 10⁻⁴~10⁻¹ + 11주차에서 자주 뽑힌 1·10 [2026-11-13 A5]
                                             # GKX 범위는 ENet(L1+L2) 기준이라 순수 Ridge와 다름. alpha = λ × 학습 행 수(기존 방식)
  ridge_input_standardize: false             # 입력이 이미 순위 [−1,1]이라 추가 표준화 없음 [GKX와 같음; 2026-11-13]. OLS는 원래 표준화 무관
  # --- 순위 모델 ---
  rank_models: [pairwise, rank_regression]  # pairwise는 XGBoost만(LightGBM에 없음) [2026-11-13 결정, Poh 외 2020]
                                             # lambdarank(XGB rank:ndcg, LGB lambdarank) 제외 [결정 2026-11-14]. 근거(자료): LGB lambdarank
                                             # lr 0.01·깊이 1~3·Fold 16·8 측정 6회 모두 최고 내부 IC 음수(−0.007~−0.052), XGB도 Colab 1회 0.003.
                                             # 같은 10분위 정답의 pairwise는 +0.043 → 상위 등급 가중이 전체 순서(Rank IC)와 반대로 학습(추정)
  rank_label: monthly_decile_0_9             # pairwise [Poh 외 2020 10분위; 5분위 대체 2026-11-13]
  rank_pairs: all                            # 두 순위 손실 모두 전체 쌍. XGB topk·쌍 수 최대, LGB truncation_level 1000 [결정; mean 추출은 OS별 결과 달라짐(XGB 문서)]
  rank_regression_target: monthly_percentile # 0~1, 손실 MSE(값이 묶여 Huber 불필요)
  # --- 부스팅 설정 ---
  boosting_regression_targets: [winsor_1_99, monthly_zscore]   # 부스팅 회귀만(선형은 위 3종 유지) [결정 2026-11-14: 계산량]
                                             # 근거(자료): 선형 4개 입력에서 원값이 6줄 모두 최저, Huber②에서는 원값≈윈저
  boosting_regression_losses: [mse, huber_sigma135]   # Huber① 제외 [결정 2026-11-14]. 근거(자료): 선형에서 Huber①−MSE +0.001~0.003,
                                             # 직선 벌점 행 약 0.1%라 사실상 MSE; GKX Table A.1 Huber 개선 작음(원문)
  boosting_h3_spans: [12, 36, 60]            # 부스팅의 H3 λ 후보(선형은 위 10개 유지) [결정 2026-11-14: 계산량·근거]
                                             # 원전 기간만: Blitz & van Vliet(2007) 강건성 1년·본문 3년, Baker·Bradley·Wurgler(2011) 5년(모두 원문).
                                             # 사이 값(18~54)은 6개월 간격 보간, 0.97은 월별 직접 근거 없음(§3.2). 선택은 그대로 내부 검증 함께 고르기
  libraries: [xgboost, lightgbm]
  depths: [1, 2, 3]                          # [GKX 1~2 ∪ LWZ 1~3]
  boosting_followup_depths: {xgb_pairwise: [4], xgb_rankreg: [4], lgb_rankreg: [4]}
                                             # 후속 튜닝 1회 [결정 2026-11-14, 원칙 "깊이 3이 자주 이기면 깊이 4 검토"].
                                             # 근거(자료, 개별형 1차): 순위 정답 3종 모두 깊이 1→2→3 IC 상승(예: XGB 순위회귀
                                             # 0.0806→0.0840→0.0863), 회귀 2종은 상승 없음 → 순위 3종만. 4는 관례상 다음 칸.
                                             # 원래 설계 결과와 따로 실행·저장(폴더 끝 _d4), 학습−검증 차이 함께 보고
  learning_rates: [0.01]                     # [GKX, LWZ 후보 {0.01, 0.1}] 중 0.01만 [결정 2026-11-14: 계산량]
                                             # 근거(자료, 12회 측정): lr 0.01의 트리 10개 ≈ lr 0.1의 트리 1개(고른 트리 ~10배, 최고 IC 차 ≤0.003),
                                             # 최고점이 대부분 작은 트리 수라 촘촘한 0.01 선택. 고른 트리가 1000 근처에 몰리면 후속으로 0.1 추가
  hyperparameter_reporting: all_candidates   # 6개 모두 보고, 내부 검증으로 고르지 않음 [교수님 피드백 2]
  max_trees: 1000                            # [GKX·LWZ 1~1000]
  tree_count_selection: best_inner_validation_ic_over_all_trees   # 1000개 모두 학습, 인내값 없음
  lightgbm_num_leaves: two_power_depth       # max_depth=d, num_leaves=2^d [LGB 조정 가이드]
  min_hessian_in_leaf: 0.001                 # XGB min_child_weight, LGB min_sum_hessian_in_leaf [LGB 기본값; 0이면 lambdarank 오류(실측, 제외 전)]
  min_data_in_leaf: 1
  l2: 0                                      # GKX Algorithm 4 기본형(추가 규제 없음). GKX·LWZ·Poh 모두 L2 미조정. 규제 후보는 나중에 검토(2026-11-13)
  l1: 0
  subsample: 1.0                             # 표본 추출 없음 → 난수 없음
  colsample: 1.0
  max_bin: 256                               # XGB 기본 256, LGB 기본 255를 256으로 맞춤 [결정]
  device: {xgboost: cuda, lightgbm: cpu}     # [결정 2026-11-14] 고를 때 쓴 장치 = 최종 모델 장치(XGB는 최종 모델도 GPU, 기존 "최종 CPU" 변경).
                                             # 근거(자료): 같은 설정에서 GPU·CPU가 다른 나무(내부 IC 0.056 vs 0.051, 예측 차 최대 0.30),
                                             # GPU 반복은 차이 0.0. 속도: XGB pairwise GPU 55초 vs CPU 약 370초(추정). LGB GPU는 max_bin 256에서
                                             # 'bin size 257' 오류로 불가 → CPU
  # --- 보고와 선택 ---
  report_metrics: [mean_ic, ic_sd, icir, ic_positive_share, r2_pct]   # 학습·바깥 검증과 그 차이, R²는 수익률 단위 예측만 [GKX 식 19]
  report_periods: [[2006, 2010], [2011, 2021], [2018, 2021]]
  test_list: best_per_model_family_full_inputs   # 모델 종류별 바깥 검증 IC 1등 설정(입력 H1+H3 기준)
  primary_model: best_validation_mean_ic         # 11주차 0.005·ICIR 규칙 대체
EVALUATION:
  method: monthly_spearman
  tie_method: average
  min_valid_stocks: 3
  constant_rank: missing_with_reason
  aggregation: equal_weight_common_valid_months
  candidate_failure: record_and_exclude
  tie_tolerance: null
SAMPLE_ID: null
REPRODUCIBILITY_PREDICTION_ATOL: 1.0e-10
FINAL_TEST_ENABLED: false
TEST_ACCESS_REQUIRES_FROZEN_CONFIG: true

